name: Build and source release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Install build dependencies
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS2_ROOT/ucrt64/bin" >> $env:GITHUB_PATH
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/install_toolchain.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/fetch.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build exact physically verified preset
        run: |
          python tools/build_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/verify_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Actual C function checks, no game CPU emulation
        run: |
          python tests/menu_host.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/present_host.py --optimize 3 --mxu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/render_host.py --mxu-render
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/audio_fast_host.py --build release-a68k-idle-dirty-selftest-o3-lto-bus-reads-tiles-mxu-spritefix-drawmxu4-audio16-visible-speed-scale-cpu408-menu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rebuild and require identical BDA
        run: |
          $first = (Get-FileHash dist/H1Arcade.bda -Algorithm SHA256).Hash
          python tools/build_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash dist/H1Arcade.bda -Algorithm SHA256).Hash -ne $first) { throw 'BDA changed on repeat build' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-json-only
          path: |
            build/verification/*.json
            build/menu-host/verification.json
            build/present-host/verification-mxu-o3.json
            build/render-host-mxu/verification.json
            build/audio-fast-host/verification.json
          if-no-files-found: error
          archive: true
          retention-days: 14
      - name: Package original H1 sources only
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/verify_release.py --check-tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/package_source.py --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: original-h1-source-release
          path: dist/release/*
          if-no-files-found: error
          archive: true
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: original-h1-source-release
          path: dist/release
          digest-mismatch: error
      - name: Verify source artifact and create source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"
          cd dist/release
          sha256sum --check SHA256SUMS.txt
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          files=list(Path('.').glob('*'))
          assert sorted(p.suffix for p in files)==['.md','.txt','.zip']
          with zipfile.ZipFile(next(Path('.').glob('*.zip'))) as z:
              assert not z.testzip()
              assert not any(n.endswith(('.bda','.dll','.exe','.h1neo','.bin','.elf','.o')) for n in z.namelist())
              manifests=[n for n in z.namelist() if n.endswith('/SOURCE-MANIFEST.json')]
              assert len(manifests)==1
              m=json.loads(z.read(manifests[0]))
              assert m['commit']==os.environ['GITHUB_SHA'] and m['tag']==os.environ['RELEASE_TAG']
          PY
          gh release create "$RELEASE_TAG" *.zip SHA256SUMS.txt --verify-tag --prerelease --title "街机游戏 $RELEASE_TAG（源码预览）" --notes-file RELEASE-NOTES.md
